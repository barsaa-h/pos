version: "3.9"

services:
  pos:
    build: .
    container_name: minii-delguur-pos
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - FLASK_ENV=production
      - POS_DB_PATH=/app/data/pos.db
      - POS_SECRET_KEY=${POS_SECRET_KEY:-change-me-to-a-random-string}
    volumes:
      - pos_data:/app/data
      - pos_backups:/app/backups
      - /dev/usb:/dev/usb:ro
    devices:
      - /dev/usb/lp0:/dev/usb/lp0
    privileged: false

volumes:
  pos_data:
  pos_backups: