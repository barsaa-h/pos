<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миний дэлгүүр — Үйлчлүүлэгч</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ─── Top Bar ─── */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 32px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(15,15,35,0.9) 0%, rgba(15,15,35,0) 100%);
            pointer-events: none; /* Don't block clicks on content below */
        }
        .store-name {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .store-name .clock {
            margin-left: 16px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: rgba(255,255,255,0.4);
        }

        /* ─── Main Display Container ─── */
        .customer-display {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 60px 40px 30px 40px;
        }

        /* ─── Views ─── */
        .view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }
        .view.active {
            display: flex;
        }

        /* ─── Idle Screen ─── */
        .idle-view {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .idle-view .welcome-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        .idle-view h1 {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .idle-view p {
            font-size: 32px;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
        }

        /* ─── Shopping Screen ─── */
        .shopping-view {
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .shopping-header {
            font-size: 24px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .item-count-badge {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(0,255,136,0.15);
            color: #00ff88;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-left: 10px;
            vertical-align: middle;
        }
        .items-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 10px;
            min-height: 0;
        }
        /* Scrollbar styling */
        .items-container::-webkit-scrollbar { width: 6px; }
        .items-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .items-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        /* ─── Item Card ─── */
        .item-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, background 0.2s;
            animation: slideIn 0.3s ease-out;
        }
        .item-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        .item-icon {
            font-size: 48px;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            flex-shrink: 0;
        }
        .item-img-full {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 14px;
            flex-shrink: 0;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-qty {
            font-size: 18px;
            color: rgba(255,255,255,0.5);
        }
        .item-price {
            font-size: 32px;
            font-weight: 700;
            color: #00ff88;
            white-space: nowrap;
            text-align: right;
        }

        /* ─── Compact Items (>5 items in cart) ─── */
        .items-container.compact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .item-compact {
            padding: 12px 16px;
            gap: 10px;
            border-radius: 12px;
            animation: none;
        }
        .item-icon-compact {
            font-size: 28px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            flex-shrink: 0;
        }
        .item-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .item-name-compact {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-qty-compact {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }
        .item-price-compact {
            font-size: 22px;
            font-weight: 700;
            color: #00ff88;
            white-space: nowrap;
            text-align: right;
        }

        /* ─── Total Bar ─── */
        .total-section {
            margin-top: 20px;
            padding: 24px 32px;
            background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,204,255,0.15));
            border: 2px solid rgba(0,255,136,0.3);
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            animation: glow 2s ease-in-out infinite alternate;
        }
        .total-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 32px;
            font-weight: 700;
            color: #00ff88;
        }
        .total-label .money-icon {
            font-size: 40px;
        }
        .total-amount {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(0,255,136,0.4);
        }

        /* ─── Paying Screen ─── */
        .paying-view {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .paying-icon {
            font-size: 100px;
            margin-bottom: 30px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .paying-title {
            font-size: 48px;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }
        .paying-total-box {
            padding: 40px 80px;
            background: rgba(255,204,0,0.1);
            border: 3px solid rgba(255,204,0,0.4);
            border-radius: 24px;
            backdrop-filter: blur(20px);
        }
        .paying-total-label {
            font-size: 24px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
        }
        .paying-total-amount {
            font-size: 96px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 40px rgba(255,204,0,0.5);
        }

        /* ─── Complete Screen ─── */
        .complete-view {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .complete-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: bounceIn 0.6s ease-out;
        }
        .complete-title {
            font-size: 64px;
            font-weight: 900;
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(0,255,136,0.5);
        }
        .complete-change {
            font-size: 48px;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease-out 0.3s both;
        }
        .complete-thanks {
            font-size: 28px;
            color: rgba(255,255,255,0.5);
            animation: fadeInUp 0.5s ease-out 0.6s both;
        }
        .complete-lottery {
            font-size: 42px;
            font-weight: 900;
            color: #ffcc00;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease-out 0.4s both;
            text-shadow: 0 0 30px rgba(255,204,0,0.5);
        }

        /* ─── Animations ─── */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(0,255,136,0.1); }
            to { box-shadow: 0 0 40px rgba(0,255,136,0.3); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Top bar: store name (unobtrusive, top right) -->
    <div class="top-bar">
        <div class="store-name">
            {{ store_info.name }}
            <span class="clock" id="customerClock">00:00</span>
        </div>
    </div>

    <div class="customer-display">
        <!-- Idle: no active cart -->
        <div id="idleView" class="view idle-view active">
            <div class="welcome-icon">🛍️</div>
            <h1>Тавтай морилно уу</h1>
            <p>Бараа сонгоно уу</p>
        </div>

        <!-- Shopping: items in cart -->
        <div id="shoppingView" class="view shopping-view">
            <div class="shopping-header">🛒 Таны сагс <span class="item-count-badge" id="itemCountBadge">0 бараа</span></div>
            <div class="items-container" id="itemList"></div>
            <div class="total-section">
                <div class="total-label">
                    <span class="money-icon">💰</span>
                    <span>НИЙТ</span>
                </div>
                <div class="total-amount" id="totalAmount">0 ₮</div>
            </div>
        </div>

        <!-- Paying: cashier clicked checkout -->
        <div id="payingView" class="view paying-view">
            <div class="paying-icon" id="payingIcon">💳</div>
            <div class="paying-title">ТӨЛБӨР ХИЙЖ БАЙНА</div>
            <div class="paying-total-box">
                <div class="paying-total-label">ТАНЫ ТӨЛӨХ ДҮН</div>
                <div class="paying-total-amount" id="payingTotal">0 ₮</div>
            </div>
        </div>

        <!-- Complete: payment confirmed -->
        <div id="completeView" class="view complete-view">
            <div class="complete-icon">✅</div>
            <div class="complete-title">БАЯРЛАЛАА!</div>
            <div class="complete-change" id="changeInfo"></div>
            <div class="complete-lottery" id="lotteryInfo" style="display:none;"></div>
            <div class="complete-thanks">Дахин ирээрэй 🙏</div>
        </div>
    </div>

    <script>
    var IDLE_TIMEOUT_SECONDS = {{ settings.get("customer_display_timeout", "10") | int }};
    var IDLE_MESSAGE = {{ settings.get("customer_idle_message", "Тавтай морилно уу") | tojson }};
    </script>
    <script src="{{ url_for('static', filename='customer.js') }}"></script>
</body>
</html>
