<!DOCTYPE html>
<html lang="mn" class="force-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ store_info.name }} — Үйлчлүүлэгч</title>
    <link rel="stylesheet" href="{{ static_url('style.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-start: #ffffff;
            --bg-mid: #f8fafc;
            --bg-end: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #334155;
            --text-muted: #475569;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --card-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            --accent-green: #15803d;
            --accent-green-light: #dcfce7;
            --accent-blue: #0369a1;
            --accent-amber: #b45309;
            --accent-amber-light: #fef3c7;
            --total-bg: #f0fdf4;
            --total-border: #86efac;
            --icon-bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ─── Top Bar ─── */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 14px 28px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }
        .store-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .store-name .clock {
            margin-left: 14px;
            font-family: 'Inter', monospace;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-secondary);
        }

        /* ─── Main Display Container ─── */
        .customer-display {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 44px 20px 14px 20px;
        }

        /* ─── Views ─── */
        .view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }
        .view.active { display: flex; }

        /* ─── Idle Screen ─── */
        .idle-view {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .idle-view .welcome-icon {
            font-size: 120px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        .idle-view h1 {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .idle-view p {
            font-size: 28px;
            color: var(--text);
            font-weight: 700;
        }

        /* ─── Shopping Screen ─── */
        .shopping-view {
            padding-top: 8px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .shopping-header {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .item-count-badge {
            display: inline-block;
            padding: 4px 14px;
            background: var(--accent-green-light);
            color: var(--accent-green);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 800;
            margin-left: 8px;
            vertical-align: middle;
            border: 2px solid var(--accent-green);
        }
        .items-container {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 1fr;
            gap: 12px;
            padding-right: 4px;
            min-height: 0;
        }
        .items-container::-webkit-scrollbar { width: 6px; }
        .items-container::-webkit-scrollbar-track { background: transparent; border-radius: 3px; }
        .items-container::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

        /* ─── Item Card ─── */
        .item-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 22px 26px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 0;
        }
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15,23,42,0.1);
        }
        .item-icon-compact {
            font-size: 38px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--icon-bg);
            border-radius: 14px;
            flex-shrink: 0;
        }
        .item-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 14px;
            flex-shrink: 0;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name-compact {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-qty-compact {
            font-size: 18px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 700;
        }
        .item-price-compact {
            font-size: 30px;
            font-weight: 900;
            color: var(--accent-green);
            white-space: nowrap;
            text-align: right;
        }

        /* ─── Total Bar ─── */
        .total-section {
            margin-top: 12px;
            padding: 18px 30px;
            background: var(--total-bg);
            border: 3px solid var(--accent-green);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(21,128,61,0.1);
        }
        .total-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-green);
        }
        .total-label .money-icon {
            font-size: 28px;
        }
        .total-amount {
            font-size: 40px;
            font-weight: 900;
            color: var(--text);
        }

        /* ─── Paying Screen ─── */
        .paying-view {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .paying-icon {
            font-size: 84px;
            margin-bottom: 24px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .paying-title {
            font-size: 42px;
            font-weight: 900;
            color: var(--accent-amber);
            margin-bottom: 28px;
            letter-spacing: 2px;
        }
        .paying-qr {
            margin-bottom: 24px;
        }
        .paying-qr-img {
            max-width: 300px;
            max-height: 300px;
            border: 4px solid var(--accent-amber);
            border-radius: 16px;
            background: #fff;
            padding: 8px;
        }
        .paying-total-box {
            padding: 36px 72px;
            background: var(--accent-amber-light);
            border: 4px solid var(--accent-amber);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(180,83,9,0.15);
        }
        .paying-total-label {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 800;
        }
        .paying-total-amount {
            font-size: 72px;
            font-weight: 900;
            color: var(--accent-amber);
        }

        .complete-lottery {
            font-size: 38px;
            font-weight: 900;
            color: var(--accent-amber);
            margin-bottom: 16px;
            animation: fadeInUp 0.5s ease-out 0.4s both;
        }

        /* ─── QR Full-screen View ─── */
        .qr-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            padding: 24px;
        }
        .qr-view .qr-amount {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .qr-view .qr-view-img {
            max-width: min(80vw, 500px);
            max-height: 55vh;
            width: auto;
            height: auto;
            border-radius: 20px;
            background: #ffffff;
            padding: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        .qr-view .qr-hint {
            font-size: 24px;
            color: rgba(255,255,255,0.75);
            font-weight: 700;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }

        /* ─── Animations ─── */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="store-name">
            {{ store_info.name }}
            <span class="clock" id="customerClock">00:00</span>
        </div>
    </div>

    <div class="customer-display">
        <div id="idleView" class="view idle-view active">
            <div class="welcome-icon">🛍️</div>
            <h1>Тавтай морилно уу</h1>
            <p>Бараа сонгоно уу</p>
        </div>

        <div id="shoppingView" class="view shopping-view">
            <div class="shopping-header">🛒 Таны сагс <span class="item-count-badge" id="itemCountBadge">0 бараа</span></div>
            <div class="items-container" id="itemList"></div>
            <div class="total-section">
                <div class="total-label">
                    <span class="money-icon">💰</span>
                    <span>НИЙТ</span>
                </div>
                <div class="total-amount" id="totalAmount">0 ₮</div>
            </div>
        </div>

        <div id="qrView" class="view qr-view">
            <div class="qr-amount" id="qrViewAmount">0 ₮</div>
            <img id="qrViewImage" class="qr-view-img" alt="QR код">
            <div class="qr-hint">📱 Гар утаснаасаа QR код уншуулна уу</div>
        </div>

        <div id="completeView" class="view paying-view">
            <div class="paying-icon">✅</div>
            <div class="paying-title">ТӨЛБӨР АМЖИЛТТАЙ</div>
            <div class="paying-total-box">
                <div class="paying-total-label" id="changeInfo" style="font-size:32px;"></div>
                <div class="paying-total-amount" id="lotteryInfo" style="display:none; font-size:32px;"></div>
            </div>
        </div>

    </div>

    <script>
    var IDLE_MESSAGE = {{ settings.get("customer_idle_message", "Тавтай морилно уу") | tojson }};
    </script>
    <script src="{{ static_url('customer.v2.js') }}"></script>
</body>
</html>
